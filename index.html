<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zunnvex Store</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #0b0b0f;
        color: white;
        padding: 20px;
    }

    .container {
        max-width: 600px;
        margin: auto;
    }

    .header {
        background: linear-gradient(135deg, #171722, #101016);
        border: 1px solid #292936;
        border-radius: 20px;
        padding: 25px 20px;
        text-align: center;
        margin-bottom: 25px;
    }

    .header h1 {
        font-size: 28px;
        margin-bottom: 8px;
    }

    .header p {
        color: #aaa;
        font-size: 14px;
    }

    .section-title {
        font-size: 20px;
        margin-bottom: 15px;
    }

    .product {
        background: #15151d;
        border: 1px solid #292936;
        border-radius: 16px;
        padding: 18px;
        margin-bottom: 15px;
    }

    .product h3 {
        font-size: 18px;
        margin-bottom: 8px;
    }

    .product p {
        color: #aaa;
        margin-bottom: 14px;
        font-size: 14px;
    }

    .buy {
        display: block;
        text-align: center;
        text-decoration: none;
        background: white;
        color: black;
        padding: 11px;
        border-radius: 10px;
        font-weight: bold;
    }

    .buy:active {
        transform: scale(0.98);
    }

    .footer {
        text-align: center;
        color: #666;
        font-size: 12px;
        margin-top: 30px;
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🛒 Zunnvex Store</h1>
        <p>Top Up Game • Pulsa • Kuota</p>
    </div>

    <h2 class="section-title">🎮 Pilih Game</h2>

    <div class="product">
        <h3>🎮 Mobile Legends</h3>
        <p>Diamond Mobile Legends</p>
        <a href="#" class="buy">BELI SEKARANG</a>
    </div>

    <div class="product">
        <h3>🔥 Free Fire</h3>
        <p>Diamond Free Fire</p>
        <a href="#" class="buy">BELI SEKARANG</a>
    </div>

    <div class="product">
        <h3>🔫 PUBG Mobile</h3>
        <p>UC PUBG Mobile</p>
        <a href="#" class="buy">BELI SEKARANG</a>
    </div>

    <div class="product">
        <h3>🟩 Roblox</h3>
        <p>Robux Roblox</p>
        <a href="#" class="buy">BELI SEKARANG</a>
    </div>

    <div class="footer">
        © 2026 Zunnvex Store
    </div>

</div>

</body>
  </html>
